openapi: 3.0.0
info:
  title: Payment Service
  version: 1.1.0
paths:
  /api/v1/payments:
    post:
      summary: Initiate a payment
      operationId: create_payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
      responses:
        '201': {description: Payment initiated}
        '422': {description: Invalid}
  /api/v1/payments/{id}:
    get:
      summary: Get a payment by ID
      operationId: get_payment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Payment found}
        '404': {description: Not found}
  /api/v1/payments/{id}/receipt:
    get:
      summary: Get a payment receipt (new)
      operationId: get_payment_receipt
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Receipt found}
        '404': {description: Not found}
components:
  schemas:
    Payment:
      type: object
      required: [id, user_id, order_id, amount, currency, status]
      properties:
        id: {type: string}
        user_id: {type: string}
        order_id: {type: string}
        amount: {type: number}
        currency: {type: string}
        status: {type: string}
    CreatePayment:
      type: object
      required: [user_id, order_id, amount]
      properties:
        user_id: {type: string}
        order_id: {type: string}
        amount: {type: number}
        currency: {type: string, default: USD}
